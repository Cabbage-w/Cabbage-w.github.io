<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日工作总结报告 · 汇总</title>
<meta name="theme-color" content="#EF9A7B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- global font is Georgia, Poppins link removed -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/700.css">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #FFFFFF;
    --card-bg: #FFFFFF;
    --ink: #1B1B1D;
    --text: #3A3A3C;
    --text-2: #8C8C90;
    --line: #ECE9E3;
    --line-strong: #DAD5CC;
    --accent: #DD7054;
    --accent-2: #E8896B;
    --accent-soft: #F4E2DB;
    --accent-tint: rgba(221,112,84,0.08);
    --green: #5E9B7E;
    --orange: #D98A4E;
    --teal: #4FA88E;
    --pink: #E08BA0;
    --yellow: #DEB15A;
    --radius: 14px;
    --serif: 'Noto Serif SC', Georgia, 'Songti SC', serif;
    --body: Georgia, 'PingFang SC', 'Microsoft YaHei', serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); min-height: 100vh; }

  body {
    font-family: var(--body);
    background: transparent;
    color: var(--text);
    line-height: 1.7;
    padding: 40px 28px 96px;
    max-width: 920px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部细线 */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: 4px; background: var(--accent);
  }

  /* ===== 报头 / Masthead（杂志式） ===== */
  .header-card {
    position: relative; z-index: 80;
    padding: 16px 0 26px; text-align: center; margin-bottom: 52px;
    border-bottom: 1px solid var(--line);
  }
  .header-card h1 {
    font-family: var(--serif);
    font-size: 34px; font-weight: 700; color: var(--ink);
    letter-spacing: -0.01em; line-height: 1.15;
    display: inline-flex; align-items: center; gap: 12px; justify-content: center;
  }
  .header-card h1 .ico {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--accent-soft);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .header-card .subtitle { color: var(--text-2); font-size: 13px; margin-top: 14px; letter-spacing: .04em; font-style: italic; }

  /* 下滑收起的小顶部栏 */
  .sticky-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 90;
    background: var(--bg);
    transform: translateY(-100%); transition: transform .28s ease;
    display: flex; justify-content: center;
    padding: 10px 28px 0;
    pointer-events: none;
    border-bottom: 1px solid var(--line);
  }
  .sticky-bar.show { transform: translateY(0); }
  .sb-inner { display: flex; align-items: center; justify-content: center; pointer-events: auto; }
  .sticky-bar .date-pill { box-shadow: none; }
  .sticky-bar .date-btn { cursor: pointer; }
  .sticky-bar .date-nav { cursor: pointer; }

  .date-row {
    display: flex; align-items: center; justify-content: center; margin-top: 26px;
    position: relative;
  }
  .date-pill {
    position: relative;
    display: flex; align-items: center; gap: 2px;
    background: var(--card-bg);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 4px 6px;
  }
  .date-nav {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: transparent; color: var(--accent); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; transition: background .18s;
  }
  .date-nav:hover { background: var(--accent-soft); }
  .date-nav:disabled { opacity: .3; cursor: not-allowed; }
  .date-nav svg { width: 18px; height: 18px; }

  .date-picker { position: relative; }
  .date-btn {
    background: transparent; color: var(--text); border: none;
    padding: 6px 14px; border-radius: 24px; font-size: 14px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .18s;
    font-variant-numeric: tabular-nums;
  }
  .date-btn:hover { background: var(--accent-soft); }
  .date-btn .cal { color: var(--accent); }
  .date-btn .cal svg { width: 17px; height: 17px; }
  .date-btn .arrow { transition: transform .2s; color: var(--accent); }
  .date-btn .arrow svg { width: 16px; height: 16px; }
  .date-picker.open .date-btn .arrow { transform: rotate(180deg); }

  .date-dropdown {
    position: fixed; left: 0; top: 0; transform: translateX(-50%) scale(0.96) translateY(-8px);
    background: var(--card-bg); border: 1px solid var(--line-strong); border-radius: 16px;
    padding: 8px; min-width: 230px; z-index: 100;
    display: block; visibility: hidden; opacity: 0; pointer-events: none;
    max-height: 320px; overflow-y: auto;
    transition: opacity .26s cubic-bezier(.4,0,.2,1), transform .26s cubic-bezier(.4,0,.2,1), visibility .26s;
  }
  .date-dropdown.open { visibility: visible; opacity: 1; transform: translateX(-50%) scale(1) translateY(0); pointer-events: auto; }
  .date-dropdown .opt {
    padding: 10px 14px; border-radius: 9px; cursor: pointer; font-size: 14px; color: var(--text);
    display: flex; align-items: center; justify-content: space-between; transition: background .12s;
  }
  .date-dropdown .opt:hover { background: var(--accent-soft); }
  .date-dropdown .opt.active { background: var(--accent-tint); color: var(--accent); font-weight: 600; }
  .date-dropdown .opt .tag { font-size: 11px; color: var(--text-2); }
  .date-dropdown .opt.active .tag { color: var(--accent); }
  .date-dropdown .hint { padding: 8px 14px; font-size: 11px; color: var(--text-2); border-top: 1px dashed var(--line-strong); margin-top: 6px; }

  /* ===== 统计卡（扁平 + 发丝边 + 顶部细色条） ===== */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 52px; }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 14px; text-align: left; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-start; min-height: 116px;
  }
  .stat-card .label { color: #5c5c60; margin-bottom: 10px; display: flex; flex-direction: column; gap: 1px; line-height: 1.1; }
  .stat-card .label .lb-cn { font-size: 12px; font-weight: 500; letter-spacing: .02em; }
  .stat-card .label .lb-en { font-size: 9.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #9a9a9e; }
  .stat-card .value { font-weight: 600; letter-spacing: -0.02em; color: var(--ink); line-height: 1.05; font-size: 30px; font-variant-numeric: tabular-nums; font-family: Georgia, serif; }
  .stat-card .sub { font-size: 12px; margin-top: 8px; font-weight: 500; color: #9a9a9e; }
  .stat-card .sub.up { color: var(--green); }
  .stat-card .sub.down { color: var(--orange); }
  .stat-card .spark { width: 100%; height: 30px; margin-top: auto; color: var(--c); display: block; }
  .stat-card.c-blue { --c: #DD7054; }
  .stat-card.c-sky { --c: #DEB15A; }
  .stat-card.c-pink { --c: #4FA88E; }
  .stat-card.c-peach { --c: #E08BA0; }
  .stat-card::after { content:""; position:absolute; left:0; right:0; top:0; height:3px; background: var(--c); }

  /* ===== 区块标题（编辑式：细横线 + 衬线标题） ===== */
  .section { margin-bottom: 44px; }
  .section-head {
    display: flex; align-items: center; gap: 12px;
    padding: 0 0 12px; margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .section-head .si { color: var(--accent); display: inline-flex; }
  .section-head .si svg { width: 19px; height: 19px; }
  .seg-toggle-all { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg); border: 1px solid var(--line-strong); border-radius: 999px; color: var(--accent); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; padding: 6px 14px; cursor: pointer; transition: all .18s; }
  .seg-toggle-all:hover { background: var(--accent-soft); }
  .seg-toggle-all svg { width: 15px; height: 15px; stroke-width: 1.8; }
  .seg-toggle-all .sta { display: inline; }
  .section-head .st { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--ink); letter-spacing: .01em; }
  .section-head .sm { margin-left: auto; font-size: 12.5px; color: var(--text-2); font-weight: 500; }
  .section-head.pink .si { color: var(--teal); }

  /* ===== 时间线 - 项目段（扁平白卡 + 发丝边） ===== */
  .seg { position: relative; background: var(--card-bg); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; transition: border-color .2s; }
  .seg::before { content: ""; position: absolute; inset: 0; background: var(--accent-tint); border-radius: inherit; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
  .seg:hover::before { opacity: 0.5; }
  .seg:active::before, .seg.tapping::before { opacity: 1; }
  .seg.fill::before { background: rgba(222,177,90,0.12); }
  .seg.fill:hover::before { opacity: 1; }
  .seg.fill:active::before, .seg.fill.tapping::before { opacity: 1; }
  .seg-head {
    position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 16px 20px; cursor: pointer; user-select: none; transition: transform .14s cubic-bezier(.4,0,.2,1);
  }
  .seg-head .seg-ico { color: var(--accent); }
  .seg.fill .seg-head .seg-ico { color: var(--orange); }
  .seg-head .seg-name { font-size: 14.5px; font-weight: 600; color: var(--ink); flex: 1; letter-spacing: .01em; }
  .seg.fill .seg-head .seg-name { color: #9a6b1e; }
  .seg-head .seg-time { font-size: 12px; color: var(--text-2); font-family: Georgia, serif; }
  .seg-head .arrow { color: var(--text-2); transition: transform .2s; }
  .seg.collapsed .arrow { transform: rotate(-90deg); }
  .seg-body { padding: 4px 20px 18px; overflow: hidden; max-height: 2600px; opacity: 1; transform: translateY(0); transition: max-height .42s cubic-bezier(.4,0,.2,1), opacity .3s ease, transform .3s ease, padding .3s ease; will-change: max-height, opacity; }
  .seg.collapsed .seg-body { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; transform: translateY(-10px); }
  @keyframes segPop { 0% { transform: scale(1); } 45% { transform: scale(1.012); } 100% { transform: scale(1); } }
  .seg.tapping { animation: segPop .34s cubic-bezier(.33,1,.68,1); }

  .tl-item { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .tl-item:last-child { border-bottom: none; }
  .tl-dot { flex: 0 0 8px; height: 8px; width: 8px; border-radius: 50%; background: var(--accent); margin-top: 8px; }
  .tl-item.fill .tl-dot { background: var(--orange); }
  .tl-time { flex: 0 0 110px; font-size: 12px; font-weight: 600; color: var(--accent); padding-top: 1px; font-family: Georgia, serif; }
  .tl-item.fill .tl-time { color: var(--orange); }
  .tl-item.fill .tl-body .t { background: rgba(222,177,90,0.14); border-color: rgba(222,177,90,0.4); border-left-color: var(--yellow); color: #9a6b1e; }
  .tl-body .t {
    font-size: 13.5px; font-weight: 600; color: #9a4a36;
    display: inline-block;
    background: var(--accent-tint);
    border: 1px solid rgba(221,112,84,0.20);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 4px 11px;
    margin-bottom: 5px;
  }
  .tl-body .d { font-size: 13px; color: var(--text-2); margin-top: 3px; }

  .gap-card {
    background: rgba(222,177,90,0.12); border: 1px solid rgba(222,177,90,0.40); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 14px;
  }
  .gap-card .gi { color: var(--orange); }
  .gap-card .gt { font-size: 14px; font-weight: 600; color: #9a6b1e; }
  .gap-card .gd { font-size: 13px; color: #6a6a6e; margin-top: 2px; font-weight: 500; }

  /* ===== 工作清单 ===== */
  .checklist-wrap { background: var(--card-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
  .checklist-wrap.pink .checklist-head .ct svg { color: var(--teal); }
  .checklist-wrap.pink .copy-btn { background: var(--teal); }
  .checklist-wrap.pink pre#checklistPre { background: rgba(79,168,142,0.08); border-color: rgba(79,168,142,0.25); font-family: Georgia, serif; }
  .checklist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .checklist-head .ct { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 8px; letter-spacing: .01em; }
  .copy-btn {
    background: var(--accent); color: #fff; border: none;
    width: 38px; height: 38px; border-radius: 50%; font-size: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; transition: filter .15s;
  }
  .copy-btn:hover { filter: brightness(1.06); }
  .copy-btn.done { background: var(--green); }
  .to-top {
    position: fixed; right: 22px; bottom: 96px; z-index: 150;
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(.4) translateY(16px); pointer-events: none;
    transition: opacity .28s cubic-bezier(.4,0,.2,1), transform .34s cubic-bezier(.4,0,.2,1), filter .15s;
  }
  .to-top.show { opacity: 1; transform: scale(.9) translateY(0); pointer-events: auto; }
  .to-top:hover { filter: brightness(1.07); }
  .to-top:active { transform: scale(.82); }
  .to-top svg { width: 17px; height: 17px; stroke-width: 2; }
  pre#checklistPre {
    background: #F5F4F1; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
    font-family: Georgia, serif; font-size: 13.5px; line-height: 1.9;
    color: var(--ink); white-space: pre-wrap; word-break: break-all;
  }

  .scan-info { background: var(--card-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 26px; margin-bottom: 34px; }
  .scan-info h3 { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .scan-info ul { list-style: none; padding: 0; }
  .scan-info li { font-size: 13px; color: var(--text-2); padding: 4px 0; }

  .footer { text-align: center; padding: 24px; color: var(--text-2); font-size: 12px; border-top: 1px solid var(--line); margin-top: 24px; }

  .note-banner { background: rgba(221,112,84,0.08); border: 1px solid rgba(221,112,84,0.30); border-radius: 14px; padding: 13px 18px; margin-bottom: 26px; font-size: 13px; color: #B5533A; display: flex; align-items: flex-start; }

  /* 日报空状态 */
  .empty-state {
    background: var(--card-bg); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 52px 28px; text-align: center; margin-bottom: 44px;
  }
  .empty-state .es-icon { color: var(--accent); margin-bottom: 18px; display: inline-flex; }
  .empty-state .es-icon svg { width: 56px; height: 56px; stroke-width: 1.5; }
  .empty-state h3 { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 10px; letter-spacing: .01em; }
  .empty-state p { font-size: 14px; color: var(--text-2); margin-bottom: 18px; }
  .empty-state .es-meta { font-size: 12.5px; color: var(--text-2); background: var(--accent-soft); border-radius: 20px; padding: 8px 16px; display: inline-block; margin-bottom: 22px; }
  .empty-state .es-btn { background: var(--accent); color: #fff; border: none; border-radius: 22px; padding: 11px 26px; font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .2s; }
  .empty-state .es-btn:hover { filter: brightness(1.06); }
  .empty-state .es-btn:active { transform: scale(.97); }

  /* 线性 SVG 图标系统 */
  .ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: -0.14em; }
  .header-card .ico svg { width: 21px; height: 21px; }
  .date-btn .cal svg { width: 17px; height: 17px; }
  .date-btn .arrow svg { width: 12px; height: 12px; transition: transform .2s; }
  .date-nav svg, .cal-nav svg { width: 16px; height: 16px; stroke-width: 2; }
  .seg-head .arrow svg { width: 14px; height: 14px; stroke-width: 2; transition: transform .2s; }
  .seg-head .seg-ico svg { width: 19px; height: 19px; }
  .seg.fill .seg-head .seg-ico svg { color: var(--orange); }
  .copy-btn svg { width: 14px; height: 14px; stroke-width: 2; }
  .checklist-head .ct svg { width: 17px; height: 17px; color: var(--accent); }
  .scan-info li { display: flex; align-items: center; }
  .scan-info li svg { width: 14px; height: 14px; stroke: var(--teal); stroke-width: 2.2; margin-right: 6px; flex: 0 0 14px; }
  .note-banner svg { width: 15px; height: 15px; stroke: #D98A4E; stroke-width: 1.9; margin-right: 6px; flex: 0 0 15px; margin-top: 1px; }
  .gap-card .gi svg { width: 18px; height: 18px; stroke: var(--orange); }
  .seg-emoji { font-size: 17px; }

  /* 日期日历弹窗 */
  .date-dropdown.calendar { width: 288px; padding: 14px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--card-bg); color: var(--accent); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all .15s; }
  .cal-nav:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cal-title { font-size: 14px; font-weight: 600; color: var(--ink); }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .cal-week span { text-align: center; font-size: 11px; color: var(--text-2); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-cell { min-height: 34px; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; font-size: 12.5px; border-radius: 8px; color: #c2c2c6; cursor: default; position: relative; }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.has { color: var(--ink); cursor: pointer; font-weight: 600; }
  .cal-cell.has:hover { background: var(--accent-soft); }
  .cal-cell.has::after { content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .cal-cell.sel { background: var(--accent); color: #fff; }
  .cal-cell.sel::after { background: #fff; }
  .cal-cell.sel:hover { background: var(--accent); }
  .cal-foot { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); font-size: 11px; color: var(--text-2); text-align: center; }

  .range-tabs { display: flex; gap: 10px; margin: 22px 0; }
  .range-btn { background: var(--card-bg); border: 1px solid var(--line-strong); border-radius: 999px; padding: 9px 20px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: all .18s; }
  .range-btn.active { background: var(--accent-tint); color: var(--accent); border-color: var(--accent); }

  /* 周期总览 */
  .period-pill {
    display: flex; align-items: center; gap: 8px; justify-content: center;
    background: var(--card-bg); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 8px 12px; margin: 18px auto 22px; max-width: 460px;
  }
  .period-pill .pp-arrow {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-strong);
    background: var(--accent-soft); color: var(--accent); cursor: pointer; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center; transition: all .16s;
  }
  .period-pill .pp-arrow:hover { background: var(--accent); color: #fff; }
  .period-pill .pp-arrow:active { transform: scale(.9); }
  .period-pill .pp-arrow svg { width: 18px; height: 18px; stroke-width: 2; }
  .period-pill .pp-label { flex: 1 1 auto; text-align: center; font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .period-pill .pp-toggle { display: flex; background: var(--accent-soft); border-radius: 18px; padding: 3px; flex: 0 0 auto; }
  .period-pill .ppt { border: none; background: none; padding: 6px 14px; border-radius: 15px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: all .16s; }
  .period-pill .ppt.active { background: #fff; color: var(--accent); }

  .timeline-view { padding: 6px 2px 4px; }
  .tl-day { margin-bottom: 22px; }
  .tl-date { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 12px; padding-left: 2px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }

  const TREND_COLOR = { design:'#EF9A7B', study:'#6FB8A0', test:'#EF9BB0', meet:'#F6C95D', misc:'#FBD9C8' };
  function icoToCat(ico) {
    if (['🎨','🖼️','🌅'].includes(ico)) return 'design';
    if (ico === '📚') return 'study';
    if (ico === '🧪') return 'test';

  function parseRealTrend(s) {
    if (!s) return null;
    let m = s.match(/([\d.]+)\s*小时/);
    if (m) return Math.round(parseFloat(m[1]) * 60);
    m = s.match(/(\d+)\s*分钟/);
    if (m) return parseInt(m[1]);
    m = s.match(/(\d+)/);
    return m ? parseInt(m[1]) : null;
  }
  // KPI 卡解剖：迷你趋势线（近 N 天，无坐标轴 sparkline）
  function sparkline(arr, w, h) {
    const vals = (arr || []).filter(v => v != null && !isNaN(v));
    if (vals.length < 2) return '';
    const max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    const range = (max - min) || 1;
    const n = vals.length, stepX = w / (n - 1);
    const pts = vals.map((v, i) => {
      const x = (8 + i * stepX).toFixed(1);
      const y = (h - 5 - ((v - min) / range) * (h - 10)).toFixed(1);
      return x + ',' + y;
    });
    const lastY = (h - 5 - ((vals[n - 1] - min) / range) * (h - 10)).toFixed(1);
    const lastX = (8 + (n - 1) * stepX).toFixed(1);
    return '<svg class="spark" viewBox="0 0 ' + (w + 16) + ' ' + h + '" preserveAspectRatio="none">'
      + '<polyline points="' + pts.join(' ') + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<circle cx="' + lastX + '" cy="' + lastY + '" r="2.4" fill="currentColor"/></svg>';
  }
  // 取当前日往前 N 天的某指标（real/gaps）分钟数
  function lastN(key, idx, n) {
    const out = [];
    for (let i = Math.max(0, idx - n + 1); i <= idx; i++) {
      const dd = DATA.dates[i];
      out.push(dd && dd.stats ? parseRealTrend(dd.stats[key]) : null);
    }
    return out;
  }
  // 增量对比：goodUp=true 表示上升为好（真实时长）；false 表示上升为差（空白补齐）
  function deltaInfo(cur, prev, goodUp) {
    if (cur == null || prev == null) return { txt: '暂无对比', cls: 'neu' };
    const diff = cur - prev;
    if (diff === 0) return { txt: '持平 较昨日', cls: 'neu' };
    const pct = Math.round(Math.abs(diff) / prev * 100);
    const good = goodUp ? diff > 0 : diff < 0;
    return { txt: (diff > 0 ? '▲ ' : '▼ ') + pct + '% 较昨日', cls: good ? 'up' : 'down' };
  }
  function statCard(cls, label, value, sub, spark) {
    return '<div class="stat-card ' + cls + '">'

  function spanMinTrend(t) {
    const mt = (t || '').match(/(\d{1,2}):(\d{2})/g) || [];
    if (mt.length >= 2) {
      const p = mt[0].split(':').map(Number), q = mt[1].split(':').map(Number);
      return (q[0] * 60 + q[1]) - (p[0] * 60 + p[1]);
    }
    return 0;
  }
  // ===== 周期总览 · 方案A：周/月导航 =====
  let trendMode = 'week';     // 'week' | 'month'
  let trendCursor = null;     // 锚定日期 id，null = 取最新一天
  function trendAnchor() {
    if (trendCursor) return trendCursor;
    const ids = DATA.dates.map(d => d.id).sort();
    return ids[ids.length - 1];
  }
  function getPeriodDates() {
    const dates = DATA.dates.slice();
    const anchor = trendAnchor();
    if (trendMode === 'month') {
      const ym = anchor.slice(0, 7);
      return dates.filter(d => d.id.slice(0, 7) === ym);
    }
    // week: 以 anchor 为终点，往前 6 天
    const end = new Date(anchor + 'T00:00:00');
    const start = new Date(end); start.setDate(end.getDate() - 6);
    const s = start.toISOString().slice(0, 10);
    return dates.filter(d => d.id >= s && d.id <= anchor).sort((a, b) => a.id.localeCompare(b.id));
  }
  function periodLabel() {
    const anchor = trendAnchor();
    if (trendMode === 'month') {
      const [, m] = anchor.split('-');
      return anchor.slice(0, 4) + '年' + parseInt(m) + '月';
    }
    const d = new Date(anchor + 'T00:00:00');
    const w = Math.ceil(d.getDate() / 7);
    return d.getFullYear() + '.' + (d.getMonth() + 1) + ' W' + w;
  }

    '每一天都是新的开始。',
    '高效工作，是为了更好地生活。',
    '小步快跑，持续迭代。',
    '做事有节奏，生活有温度。',
    '主动一点，机会就近一点。',
    '复盘让经验变成能力。',
    '保持输出，保持成长。',
    '你的认真，时间都看得见。',
    '不怕慢，就怕站。',
    '用数据说话，用行动证明。',
    '今日事，今日毕。',
    '把工作当作作品，把今天当作礼物。',
    '好习惯，是最高效的复利。'
  ];
  function pickQuote() {
    const id = DATA.dates[current] ? DATA.dates[current].id : new Date().toISOString().slice(0,10);
    let n = 0;
    for (let i = 0; i < id.length; i++) n = (n * 31 + id.charCodeAt(i)) >>> 0;
    return QUOTES[n % QUOTES.length];
  }
  function dismissSplash() {
    if (!splash || splash.classList.contains('out')) return;
    navTo('timeline');
    splash.classList.add('out');
    setTimeout(() => { splash.style.display = 'none'; }, 520);
  }
  if (splash) {
    const q = document.getElementById('dailyQuote');
    if (q) q.innerHTML = pickQuote();
    const h = document.getElementById('splashHint');
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    if (h) h.textContent = days[new Date().getDay()];
    splash.addEventListener('click', dismissSplash);
    requestAnimationFrame(() => splash.classList.add('in'));
  }

  renderDate(current);
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
