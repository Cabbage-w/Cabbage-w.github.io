<style>
  :root {
    --bg: #f3f5f7;
    --bg-top: #e9eff5;
    --card-bg: #ffffff;
    --border: #e6eaee;
    --border-strong: #dbe2e8;
    --text: #3a444d;
    --text-secondary: #8b97a3;
    --title: #2b343b;
    --accent: #5e93b8;
    --accent-soft: #8fb0cc;
    --accent-tint: #5e93b818;
    --green: #7fae93;
    --orange: #cf9f76;
    --red: #c98f8f;
    --purple: #a89ec6;
    --teal: #5caaa3;
    --pink: #c79aae;
    --shadow: 0 1px 3px rgba(43,60,80,0.05);
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 320px, var(--bg) 100%);
    color: var(--text);
    line-height: 1.65;
    padding: 0 28px 56px;
    max-width: 920px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    height: 4px;
    background: linear-gradient(90deg, #5e93b8, #8fb0cc, #aecadf, #8fb0cc, #5e93b8);
    border-radius: 0 0 6px 6px;
    margin: 0 -28px 0;
  }

  /* 头部 */
  .header-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
    padding: 34px 28px 28px; text-align: center; margin-bottom: 40px;
    box-shadow: 0 1px 3px rgba(43,60,80,0.04);
  }
  .header-card h1 {
    font-size: 30px; font-weight: 700; color: var(--title);
    letter-spacing: -0.03em; line-height: 1.2;
    display: inline-flex; align-items: center; gap: 12px; justify-content: center;
  }
  .header-card h1 .ico {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--accent-tint);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .header-card .subtitle { color: var(--text-secondary); font-size: 13.5px; margin-top: 10px; letter-spacing: .02em; font-weight: 400; }

  /* 下滑收起的小顶部栏 */
  .sticky-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    background: rgba(255,255,255,0.82);
    -webkit-backdrop-filter: saturate(180%) blur(12px); backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--border);
    transform: translateY(-100%); transition: transform .28s ease;
    display: flex; justify-content: center;
  }
  .sticky-bar.show { transform: translateY(0); }
  .sb-inner { width: 100%; max-width: 920px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px 28px; }
  .sb-label {
    font-size: 14px; font-weight: 600; color: var(--title); cursor: pointer;
    padding: 5px 12px; border-radius: 9px; display: inline-flex; align-items: center; gap: 8px;
    transition: background .15s;
  }
  .sb-label:hover { background: var(--bg); }
  .sb-label .cal { color: var(--accent); }
  .sb-label .cal svg { width: 17px; height: 17px; }

  .date-row {
    display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 22px;
    position: relative;
  }
  .date-nav {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--accent); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; transition: all .18s;
  }
  .date-nav:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .date-nav:disabled { opacity: .3; cursor: not-allowed; }

  .date-picker { position: relative; }
  .date-btn {
    background: var(--accent-tint); color: var(--accent); border: 1px solid #5e93b833;
    padding: 9px 20px 9px 16px; border-radius: 24px; font-size: 14px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 9px; transition: all .18s;
  }
  .date-btn:hover { background: #5e93b826; }
  .date-btn .cal { color: var(--accent); }
  .date-btn .arrow { transition: transform .2s; }
  .date-picker.open .date-btn .arrow { transform: rotate(180deg); }

  .date-dropdown {
    position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%);
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(40,60,80,0.14); padding: 8px; min-width: 230px; z-index: 50;
    display: none; max-height: 320px; overflow-y: auto;
  }
  .date-picker.open .date-dropdown { display: block; }
  .date-dropdown .opt {
    padding: 10px 14px; border-radius: 9px; cursor: pointer; font-size: 14px; color: var(--text);
    display: flex; align-items: center; justify-content: space-between; transition: background .12s;
  }
  .date-dropdown .opt:hover { background: var(--bg); }
  .date-dropdown .opt.active { background: var(--accent-tint); color: var(--accent); font-weight: 600; }
  .date-dropdown .opt .tag { font-size: 11px; color: var(--text-secondary); }
  .date-dropdown .opt.active .tag { color: var(--accent); }
  .date-dropdown .hint { padding: 8px 14px; font-size: 11px; color: var(--text-secondary); border-top: 1px dashed var(--border); margin-top: 6px; }

  /* 统计卡片 */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; margin-bottom: 44px; }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 18px; text-align: center; position: relative;
  }
  .stat-card .label { font-size: 11.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; font-weight: 600; }
  .stat-card .value { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: var(--title); }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.orange { color: var(--orange); }
  .stat-card .value.blue { color: var(--accent); }
  .stat-card .value.purple { color: var(--purple); }

  /* 区块标题 */
  .section { margin-bottom: 44px; }
  .section-head {
    display: flex; align-items: center; gap: 11px;
    background: var(--accent-tint); border: 1px solid #5e93b82e; border-radius: 12px;
    padding: 13px 18px; margin-bottom: 16px;
  }
  .section-head .si { color: var(--accent); display: inline-flex; }
  .section-head .si svg { width: 19px; height: 19px; }
  .section-head .st { font-size: 16.5px; font-weight: 700; color: var(--title); letter-spacing: .01em; }
  .section-head .sm { margin-left: auto; font-size: 12.5px; color: var(--text-secondary); font-weight: 500; }

  /* 时间线 - 项目段 */
  .seg { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .seg-head {
    display: flex; align-items: center; gap: 12px; padding: 16px 20px; cursor: pointer; user-select: none;
    border-left: 3px solid var(--accent); transition: background .15s;
  }
  .seg-head:hover { background: rgba(94,147,184,0.05); }
  .seg.fill .seg-head { border-left-color: var(--orange); }
  .seg-head .seg-ico { color: var(--accent); }
  .seg.fill .seg-head .seg-ico { color: var(--orange); }
  .seg-head .seg-name { font-size: 14.5px; font-weight: 600; color: var(--title); flex: 1; letter-spacing: .01em; }
  .seg.fill .seg-head .seg-name { color: #9c7b54; }
  .seg-head .seg-time { font-size: 12px; color: var(--text-secondary); }
  .seg-head .arrow { color: var(--text-secondary); transition: transform .2s; }
  .seg.collapsed .arrow { transform: rotate(-90deg); }
  .seg-body { padding: 4px 20px 18px; }

  .tl-item { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid #eef1f4; }
  .tl-item:last-child { border-bottom: none; }
  .tl-dot { flex: 0 0 8px; height: 8px; width: 8px; border-radius: 50%; background: var(--accent); margin-top: 8px; }
  .tl-item.fill .tl-dot { background: var(--orange); }
  .tl-time { flex: 0 0 110px; font-size: 12px; font-weight: 700; color: var(--accent); padding-top: 1px; }
  .tl-item.fill .tl-time { color: var(--orange); }
  .tl-body .t { font-size: 14px; font-weight: 600; color: var(--title); }
  .tl-body .d { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }

  .gap-card {
    background: #cf9f7611; border: 1px dashed #cf9f6444; border-radius: 12px;
    padding: 14px 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 14px;
  }
  .gap-card .gi { color: var(--orange); }
  .gap-card .gt { font-size: 13px; font-weight: 600; color: var(--orange); }
  .gap-card .gd { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  /* 工作清单 */
  .checklist-wrap { background: var(--card-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 20px 22px; }
  .checklist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .checklist-head .ct { font-size: 14.5px; font-weight: 600; color: var(--title); display: flex; align-items: center; gap: 8px; letter-spacing: .01em; }
  .copy-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 8px 18px; border-radius: 22px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
  }
  .copy-btn:hover { filter: brightness(1.06); }
  .copy-btn.done { background: var(--green); }
  pre#checklistPre {
    background: #f6f8fa; border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px;
    font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 13.5px; line-height: 1.9;
    color: var(--title); white-space: pre-wrap; word-break: break-all;
  }

  .scan-info { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 34px; }
  .scan-info h3 { font-size: 13.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; letter-spacing: .03em; text-transform: uppercase; }
  .scan-info ul { list-style: none; padding: 0; }
  .scan-info li { font-size: 13px; color: var(--teal); padding: 4px 0; }

  .footer { text-align: center; padding: 24px; color: var(--text-secondary); font-size: 12px; border-top: 1px solid var(--border); margin-top: 24px; }

  .note-banner { background: #cf9f7611; border: 1px solid #cf9f6444; border-radius: 12px; padding: 13px 18px; margin-bottom: 26px; font-size: 13px; color: #9c7b54; display: flex; align-items: flex-start; }

  /* 线性 SVG 图标系统 */
  .ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: -0.14em; }
  .header-card .ico { color: var(--accent); }
  .header-card .ico svg { width: 21px; height: 21px; }
  .date-btn .cal svg { width: 17px; height: 17px; }
  .date-btn .arrow svg { width: 12px; height: 12px; transition: transform .2s; }
  .date-nav svg, .cal-nav svg { width: 16px; height: 16px; stroke-width: 2; }
  .seg-head .arrow svg { width: 14px; height: 14px; stroke-width: 2; transition: transform .2s; }
  .seg-head .seg-ico svg { width: 19px; height: 19px; }
  .seg.fill .seg-head .seg-ico svg { color: var(--orange); }
  .copy-btn svg { width: 14px; height: 14px; stroke-width: 2; }
  .checklist-head .ct svg { width: 17px; height: 17px; color: var(--accent); }
  .scan-info li { display: flex; align-items: center; }
  .scan-info li svg { width: 14px; height: 14px; stroke: var(--teal); stroke-width: 2.2; margin-right: 6px; flex: 0 0 14px; }
  .note-banner svg { width: 15px; height: 15px; stroke: #b8895a; stroke-width: 1.9; margin-right: 6px; flex: 0 0 15px; margin-top: 1px; }
  .gap-card .gi svg { width: 18px; height: 18px; stroke: var(--orange); }
  .seg-emoji { font-size: 17px; }

  /* 日期日历弹窗 */
  .date-dropdown.calendar { width: 288px; padding: 14px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--card-bg); color: var(--accent); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all .15s; }
  .cal-nav:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cal-title { font-size: 14px; font-weight: 700; color: var(--title); }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .cal-week span { text-align: center; font-size: 11px; color: var(--text-secondary); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-cell { min-height: 34px; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; font-size: 12.5px; border-radius: 8px; color: #c2ccd4; cursor: default; position: relative; }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.has { color: var(--title); cursor: pointer; font-weight: 600; }
  .cal-cell.has:hover { background: var(--accent-tint); }
  .cal-cell.has::after { content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .cal-cell.sel { background: var(--accent); color: #fff; }
  .cal-cell.sel::after { background: #fff; }
  .cal-cell.sel:hover { background: var(--accent); }
  .cal-foot { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--text-secondary); text-align: center; }
</style>
</head>

    book: '<path d="M4 5a2 2 0 0 1 2-2h5v16H6a2 2 0 0 0-2 2z"/><path d="M20 5a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2z"/>',

  const SEG_ICON = { '\u{1F4AC}':'chat', '\u{1F3A8}':'palette', '\u{1F37D}\u{FE0F}':'food', '\u{1F512}':'lock', '\u{1F9EA}':'lab', '\u{1F4DA}':'book', '\u{1F4CA}':'chart', '\u{1F4CB}':'copy', '\u{1F4DD}':'list', '\u{26A0}\u{FE0F}':'warn' };
  function segIco(emoji) { const k = SEG_ICON[emoji]; return k ? ic(k) : '<span class="seg-emoji">'+emoji+'</span>'; }


  function renderDate(idx) {
    const d = DATA.dates[idx];
    current = idx;

    // 日期选择器
    const rel = relLabel(d.id);
    $('#dateLabel').textContent = d.label + (rel ? ' · ' + rel : '');
    const sbL = document.getElementById('sbDateLabel'); if (sbL) sbL.textContent = d.label + (rel ? ' · ' + rel : '');
    if (picker.classList.contains('open')) renderCalendar();
    $('#prevBtn').disabled = idx === 0;
    $('#nextBtn').disabled = idx === DATA.dates.length - 1;
    document.querySelectorAll('#dateDropdown .opt').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });

    // 统计卡片
    const s = d.stats;
    let segsHtml = '';
    d.segments.forEach((seg) => {
      const fillCls = seg.fill ? ' fill' : '';
      const lunchCls = seg.lunch ? ' lunch' : '';
      let body = '';
      seg.events.forEach((ev) => {
        const evFill = (seg.fill && !seg.lunch) ? ' fill' : '';
        body += `<div class="tl-item${evFill}">
          <div class="tl-dot"></div>
          <div class="tl-time">${ev.time}</div>
          <div class="tl-body"><div class="t">${ev.t}</div><div class="d">${ev.d || ''}</div></div>
        </div>`;
      });
      const segHtml = seg.lunch
        ? `<div class="gap-card${lunchCls}"><div class="gi">${segIco(seg.ico)}</div><div><div class="gt">${seg.events[0].time}</div><div class="gd">${seg.events[0].d}</div></div></div>`
        : `<div class="seg${fillCls}">
            <div class="seg-head" onclick="toggleSeg(this)">
              <span class="seg-ico">${segIco(seg.ico)}</span>
              <span class="seg-name">${seg.title}</span>
              <span class="seg-time">${seg.time}</span>
              <span class="arrow">${ic('down')}</span>
            </div>
            <div class="seg-body">${body}</div>
          </div>`;
      segsHtml += segHtml;
    });

    const checklist = d.checklist.join('\n');

    const scanHtml = d.scanInfo.map((x) => `<li>${ic('check')}${x}</li>`).join('');
    const noteHtml = d.note ? `<div class="note-banner">${ic('warn')} <span>${d.note}</span></div>` : '';

    $('#reportView').innerHTML = `
      ${noteHtml}
      <div class="stats-row">
        <div class="stat-card"><div class="label">最早活动</div><div class="value blue">${s.start}</div></div>
        <div class="stat-card"><div class="label">最后活动</div><div class="value green">${s.end}</div></div>
        <div class="stat-card"><div class="label">真实时长</div><div class="value green">${s.real}</div></div>
        <div class="stat-card"><div class="label">空白/补齐</div><div class="value orange">${s.gaps}</div></div>
      </div>

      <div class="section">
        <div class="section-head"><span class="si">${ic('clock')}</span><span class="st">工作时间线</span><span class="sm">${d.segments.length} 个时段</span></div>

      </div>

      <div class="section">
        <div class="section-head"><span class="si">${ic('list')}</span><span class="st">工作项清单</span><span class="sm">可一键复制</span></div>
        <div class="checklist-wrap">
          <div class="checklist-head">
            <div class="ct">${ic('list')} 当日工作项</div>
            <button class="copy-btn" id="copyBtn" onclick="copyChecklist()">${ic('copy')} 复制清单</button>
          </div>
          <pre id="checklistPre">${checklist}</pre>
        </div>
      </div>

      <div class="scan-info">
        <h3>扫描了哪些数据源</h3>
        <ul>${scanHtml}</ul>
      </div>
    `;

    $('#footerView').textContent = d.footer || '';
  }

  function toggleSeg(head) {
    head.closest('.seg').classList.toggle('collapsed');
  }

  function copyChecklist() {
    const text = document.getElementById('checklistPre').textContent;
    const btn = document.getElementById('copyBtn');
    const done = () => {
      btn.innerHTML = ic('check') + ' 已复制';
      btn.classList.add('done');
      setTimeout(() => { btn.innerHTML = ic('copy') + ' 复制清单'; btn.classList.remove('done'); }, 1500);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ===== 日期日历弹窗 =====
  const picker = $('#datePicker');
  const dd = $('#dateDropdown');

  function relLabel(id) {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const d = new Date(id + 'T00:00:00');
    const diff = Math.round((t - d) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff === -1) return '明天';
    return '';
  }

  const reportMap = {};
  DATA.dates.forEach((d, i) => { reportMap[d.id] = i; });
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  let calDate = new Date(DATA.dates[current].id + 'T00:00:00');

  function renderCalendar() {
    const y = calDate.getFullYear();
    const m = calDate.getMonth();
    let html = '<div class="cal-head">'
      + '<button class="cal-nav" id="calPrev">' + ic('left') + '</button>'
      + '<div class="cal-title">' + y + '年' + (m + 1) + '月</div>'
      + '<button class="cal-nav" id="calNext">' + ic('right') + '</button></div>';
    html += '<div class="cal-week">' + WEEK.map(w => '<span>' + w + '</span>').join('') + '</div>';
    html += '<div class="cal-grid">';
    const startPad = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < startPad; i++) html += '<div class="cal-cell empty"></div>';
    for (let day = 1; day <= daysInMonth; day++) {
      const id = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      const has = (id in reportMap);
      const sel = (id === DATA.dates[current].id);
      const cls = 'cal-cell' + (has ? ' has' : '') + (sel ? ' sel' : '');
      html += '<div class="' + cls + '"' + (has ? ' data-id="' + id + '"' : '') + '>' + day + '</div>';
    }
    html += '</div>';
    const total = Object.keys(reportMap).length;
    html += '<div class="cal-foot">蓝点 = 有日报 · 共 ' + total + ' 天可查 · ‹ › 切换相邻日</div>';
    dd.innerHTML = html;
    document.getElementById('calPrev').addEventListener('click', (e) => { e.stopPropagation(); calDate.setMonth(calDate.getMonth() - 1); renderCalendar(); });
    document.getElementById('calNext').addEventListener('click', (e) => { e.stopPropagation(); calDate.setMonth(calDate.getMonth() + 1); renderCalendar(); });
    dd.querySelectorAll('.cal-cell.has').forEach(cell => {
      cell.addEventListener('click', (e) => {
        e.stopPropagation();
        renderDate(reportMap[cell.getAttribute('data-id')]);
        picker.classList.remove('open');
      });
    });
  }

  $('#dateBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const willOpen = !picker.classList.contains('open');
    picker.classList.toggle('open');
    if (willOpen) {
      calDate = new Date(DATA.dates[current].id + 'T00:00:00');
      renderCalendar();
    }
  });
  document.addEventListener('click', (e) => {
    if (!picker.contains(e.target)) picker.classList.remove('open');
  });
  $('#prevBtn').addEventListener('click', () => { if (current > 0) renderDate(current - 1); });
  $('#nextBtn').addEventListener('click', () => { if (current < DATA.dates.length - 1) renderDate(current + 1); });

  // 下滑收起的小顶部栏
  const stickyBar = document.getElementById('stickyBar');
  function onScroll() { if (stickyBar) stickyBar.classList.toggle('show', window.scrollY > 200); }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  document.getElementById('sbPrev').addEventListener('click', () => { if (current > 0) renderDate(current - 1); });
  document.getElementById('sbNext').addEventListener('click', () => { if (current < DATA.dates.length - 1) renderDate(current + 1); });
  document.getElementById('sbLabel').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  renderDate(current);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
