<style>
  :root {
    --bg: #eef2f5;
    --bg-top: #e6f0f8;
    --card-bg: #ffffff;
    --border: #d8e0e6;
    --text: #3d4750;
    --text-secondary: #8794a0;
    --title: #2f3a42;
    --accent: #6fa3c7;
    --accent-soft: #8fb0cc;
    --green: #9fc0ae;
    --orange: #d8b693;
    --red: #d2a0a0;
    --purple: #b0a6cd;
    --teal: #6fb3ad;
    --pink: #d2a6bd;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 260px, var(--bg) 100%);
    color: var(--text);
    line-height: 1.6;
    padding: 0 24px 40px;
    max-width: 900px;
    margin: 0 auto;
  }
  .topbar {
    height: 6px;
    background: linear-gradient(90deg, #6fa3c7, #8fb0cc, #a9c7e0, #8fb0cc, #6fa3c7);
    border-radius: 0 0 6px 6px;
    margin: 0 -24px 0;
  }

  /* 头部 + 日期选择器 */
  .header { text-align: center; padding: 34px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .header h1 {
    font-size: 27px; font-weight: 700; color: var(--title);
    display: inline-flex; align-items: center; gap: 10px; justify-content: center;
  }
  .header h1 .ico {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #6fa3c7, #8fb0cc);
    display: inline-flex; align-items: center; justify-content: center; font-size: 18px;
    box-shadow: 0 2px 6px rgba(111,163,199,0.35);
  }
  .header .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }

  .date-row {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px;
    position: relative;
  }
  .date-nav {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--accent); font-size: 16px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .date-nav:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .date-nav:disabled { opacity: .35; cursor: not-allowed; }

  .date-picker {
    position: relative;
  }
  .date-btn {
    background: #6fa3c722; color: #4f86ab; border: 1px solid #6fa3c744;
    padding: 7px 18px 7px 14px; border-radius: 22px; font-size: 14px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all .15s;
  }
  .date-btn:hover { background: #6fa3c733; }
  .date-btn .cal { font-size: 16px; }
  .date-btn .arrow { font-size: 11px; transition: transform .2s; }
  .date-picker.open .date-btn .arrow { transform: rotate(180deg); }

  .date-dropdown {
    position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(60,80,100,0.18); padding: 8px; min-width: 230px; z-index: 50;
    display: none; max-height: 320px; overflow-y: auto;
  }
  .date-picker.open .date-dropdown { display: block; }
  .date-dropdown .opt {
    padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text);
    display: flex; align-items: center; justify-content: space-between; transition: background .12s;
  }
  .date-dropdown .opt:hover { background: var(--bg); }
  .date-dropdown .opt.active { background: #6fa3c722; color: #4f86ab; font-weight: 600; }
  .date-dropdown .opt .tag { font-size: 11px; color: var(--text-secondary); }
  .date-dropdown .opt.active .tag { color: #4f86ab; }
  .date-dropdown .hint { padding: 6px 14px; font-size: 11px; color: var(--text-secondary); border-top: 1px dashed var(--border); margin-top: 6px; }

  /* 统计卡片 */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 34px; }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--border); border-top: 3px solid var(--accent);
    border-radius: 12px; padding: 18px 16px; text-align: center;
    box-shadow: 0 2px 8px rgba(60,80,100,0.06); position: relative; overflow: hidden;
  }
  .stat-card::after { content: ''; position: absolute; right: -18px; top: -18px; width: 56px; height: 56px; border-radius: 50%; background: #6fa3c714; }
  .stat-card .label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .stat-card .value { font-size: 22px; font-weight: 700; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.orange { color: var(--orange); }
  .stat-card .value.blue { color: var(--accent); }
  .stat-card .value.purple { color: var(--purple); }

  /* 区块标题 */
  .section { margin-bottom: 32px; }
  .section-title {
    font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    color: var(--title);
  }
  .section-title .bar { width: 4px; height: 18px; border-radius: 3px; background: var(--accent); display: inline-block; }

  /* 时间线 - 项目段 */
  .seg { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(60,80,100,0.05); }
  .seg-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer; user-select: none;
    border-left: 4px solid var(--accent); transition: background .15s;
  }
  .seg-head:hover { background: #6fa3c20; background: rgba(111,163,199,0.06); }
  .seg.fill .seg-head { border-left-color: var(--orange); }
  .seg-head .seg-ico { font-size: 17px; }
  .seg-head .seg-name { font-size: 15px; font-weight: 600; color: var(--title); flex: 1; }
  .seg.fill .seg-head .seg-name { color: #9c7b54; }
  .seg-head .seg-time { font-size: 12px; color: var(--text-secondary); }
  .seg-head .arrow { font-size: 13px; color: var(--text-secondary); transition: transform .2s; }
  .seg.collapsed .arrow { transform: rotate(-90deg); }
  .seg-body { padding: 4px 18px 16px; }
  .seg.collapsed .seg-body { display: none; }

  .tl-item { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .tl-item:last-child { border-bottom: none; }
  .tl-dot { flex: 0 0 10px; height: 10px; width: 10px; border-radius: 50%; background: var(--accent); margin-top: 7px; }
  .tl-item.fill .tl-dot { background: var(--orange); }
  .tl-time { flex: 0 0 110px; font-size: 12px; font-weight: 700; color: var(--accent); padding-top: 1px; }
  .tl-item.fill .tl-time { color: var(--orange); }
  .tl-body .t { font-size: 14px; font-weight: 600; color: var(--title); }
  .tl-body .d { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

  .gap-card {
    background: #d8b69311; border: 1px dashed #d8b69344; border-radius: 10px;
    padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px;

  /* 工作清单 */
  .checklist-wrap { background: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 12px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(60,80,100,0.05); }
  .checklist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .checklist-head .ct { font-size: 15px; font-weight: 700; color: var(--title); display: flex; align-items: center; gap: 8px; }

  .copy-btn:hover { filter: brightness(1.05); }
  .copy-btn.done { background: linear-gradient(135deg, #9fc0ae, #6fb3ad); }
  pre#checklistPre {
    background: #f4f6f8; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
    font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 13.5px; line-height: 1.9;

  .scan-info h3 { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
  .scan-info ul { list-style: none; padding: 0; }
  .scan-info li { font-size: 13px; color: var(--teal); padding: 3px 0; }
  .scan-info li::before { content: '✓ '; margin-right: 4px; }

  .footer { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 12px; border-top: 1px solid var(--border); margin-top: 20px; }

  .note-banner { background: #d8b69315; border: 1px solid #d8b69344; border-radius: 10px; padding: 12px 16px; margin-bottom: 22px; font-size: 13px; color: #9c7b54; }

  .date-dropdown.calendar { width: 288px; padding: 14px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--card-bg); color: var(--accent); font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all .15s; }
  .cal-nav:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cal-title { font-size: 14px; font-weight: 700; color: var(--title); }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .cal-week span { text-align: center; font-size: 11px; color: var(--text-secondary); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-cell { min-height: 34px; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; font-size: 12.5px; border-radius: 8px; color: #c2ccd4; cursor: default; position: relative; }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.has { color: var(--title); cursor: pointer; font-weight: 600; }
  .cal-cell.has:hover { background: #6fa3c722; }
  .cal-cell.has::after { content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .cal-cell.sel { background: var(--accent); color: #fff; }
  .cal-cell.sel::after { background: #fff; }
  .cal-cell.sel:hover { background: var(--accent); }
  .cal-foot { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--text-secondary); text-align: center; }
</style>
</head>

    d.segments.forEach((seg) => {
      const fillCls = seg.fill ? ' fill' : '';
      const lunchCls = seg.lunch ? ' lunch' : '';
      let body = '';
      seg.events.forEach((ev) => {
        const evFill = (seg.fill && !seg.lunch) ? ' fill' : '';
        body += `<div class="tl-item${evFill}">
          <div class="tl-dot"></div>
          <div class="tl-time">${ev.time}</div>
          <div class="tl-body"><div class="t">${ev.t}</div><div class="d">${ev.d || ''}</div></div>
        </div>`;
      });
      const segHtml = seg.lunch
        ? `<div class="gap-card${lunchCls}"><div class="gi">🍽️</div><div><div class="gt">${seg.events[0].time}</div><div class="gd">${seg.events[0].d}</div></div></div>`
        : `<div class="seg${fillCls}">
            <div class="seg-head" onclick="toggleSeg(this)">
              <span class="seg-ico">${seg.ico}</span>
              <span class="seg-name">${seg.title}</span>
              <span class="seg-time">${seg.time}</span>
              <span class="arrow">▾</span>
            </div>
            <div class="seg-body">${body}</div>
          </div>`;
      segsHtml += segHtml;
    });

    const checklist = d.checklist.join('\n');

    const scanHtml = d.scanInfo.map((x) => `<li>${x}</li>`).join('');
    const noteHtml = d.note ? `<div class="note-banner">⚠️ ${d.note}</div>` : '';

    $('#reportView').innerHTML = `
      ${noteHtml}
      <div class="stats-row">
        <div class="stat-card"><div class="label">最早活动</div><div class="value blue">${s.start}</div></div>
        <div class="stat-card"><div class="label">最后活动</div><div class="value green">${s.end}</div></div>
        <div class="stat-card"><div class="label">真实时长</div><div class="value green">${s.real}</div></div>
        <div class="stat-card"><div class="label">空白/补齐</div><div class="value orange">${s.gaps}</div></div>
      </div>

      <div class="section">
        <div class="section-title"><span class="bar"></span>工作时间线</div>
        ${segsHtml}
      </div>

      <div class="section">
        <div class="section-title"><span class="bar"></span>工作项清单（可直接复制）</div>
        <div class="checklist-wrap">
          <div class="checklist-head">
            <div class="ct">📝 当日工作项</div>
            <button class="copy-btn" id="copyBtn" onclick="copyChecklist()">📋 复制清单</button>
          </div>
          <pre id="checklistPre">${checklist}</pre>
        </div>
      </div>

      <div class="scan-info">
        <h3>扫描了哪些数据源</h3>
        <ul>${scanHtml}</ul>
      </div>
    `;

    $('#footerView').textContent = d.footer || '';
  }

  function toggleSeg(head) {
    head.closest('.seg').classList.toggle('collapsed');
  }

  function copyChecklist() {
    const text = document.getElementById('checklistPre').textContent;
    const btn = document.getElementById('copyBtn');
    const done = () => {
      btn.textContent = '✓ 已复制';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = '📋 复制清单'; btn.classList.remove('done'); }, 1500);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ===== 日期日历弹窗 =====
  const picker = $('#datePicker');
  const dd = $('#dateDropdown');

  function relLabel(id) {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const d = new Date(id + 'T00:00:00');
    const diff = Math.round((t - d) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff === -1) return '明天';
    return '';
  }

  const reportMap = {};
  DATA.dates.forEach((d, i) => { reportMap[d.id] = i; });
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  let calDate = new Date(DATA.dates[current].id + 'T00:00:00');

  function renderCalendar() {
    const y = calDate.getFullYear();
    const m = calDate.getMonth();
    let html = '<div class="cal-head">'
      + '<button class="cal-nav" id="calPrev">‹</button>'
      + '<div class="cal-title">' + y + '年' + (m + 1) + '月</div>'
      + '<button class="cal-nav" id="calNext">›</button></div>';
    html += '<div class="cal-week">' + WEEK.map(w => '<span>' + w + '</span>').join('') + '</div>';
    html += '<div class="cal-grid">';
    const startPad = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < startPad; i++) html += '<div class="cal-cell empty"></div>';
    for (let day = 1; day <= daysInMonth; day++) {
      const id = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      const has = (id in reportMap);
      const sel = (id === DATA.dates[current].id);
      const cls = 'cal-cell' + (has ? ' has' : '') + (sel ? ' sel' : '');
      html += '<div class="' + cls + '"' + (has ? ' data-id="' + id + '"' : '') + '>' + day + '</div>';
    }
    html += '</div>';
    const total = Object.keys(reportMap).length;
    html += '<div class="cal-foot">蓝点 = 有日报 · 共 ' + total + ' 天可查 · ‹ › 切换相邻日</div>';
    dd.innerHTML = html;
    document.getElementById('calPrev').addEventListener('click', (e) => { e.stopPropagation(); calDate.setMonth(calDate.getMonth() - 1); renderCalendar(); });
    document.getElementById('calNext').addEventListener('click', (e) => { e.stopPropagation(); calDate.setMonth(calDate.getMonth() + 1); renderCalendar(); });
    dd.querySelectorAll('.cal-cell.has').forEach(cell => {
      cell.addEventListener('click', (e) => {
        e.stopPropagation();
        renderDate(reportMap[cell.getAttribute('data-id')]);
        picker.classList.remove('open');
      });
    });
  }

  $('#dateBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const willOpen = !picker.classList.contains('open');
    picker.classList.toggle('open');
    if (willOpen) {
      calDate = new Date(DATA.dates[current].id + 'T00:00:00');
      renderCalendar();
    }
  });
  document.addEventListener('click', (e) => {
    if (!picker.contains(e.target)) picker.classList.remove('open');
  });
  $('#prevBtn').addEventListener('click', () => { if (current > 0) renderDate(current - 1); });
  $('#nextBtn').addEventListener('click', () => { if (current < DATA.dates.length - 1) renderDate(current + 1); });

  renderDate(current);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
