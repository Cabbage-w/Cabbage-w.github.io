const CAT = {design:'设计产出', study:'学习', test:'测试探索', meet:'沟通会议', misc:'其他'};
const CAT_COLOR = {design:'#7CB1D2', study:'#B8D0E5', test:'#C98AAA', meet:'#E0A85A', misc:'#9DB0BF'};
function icoToCat(ico){
  if(['🎨','🖼️','🌅'].includes(ico)) return 'design';
  if(ico==='📚') return 'study';
  if(ico==='🧪') return 'test';
  if(['💬','📊'].includes(ico)) return 'meet';
  return 'misc';
}
function parseReal(s){
  if(!s) return null;
  let m = s.match(/([\d.]+)\s*小时/);
  if(m) return Math.round(parseFloat(m[1])*60);
  m = s.match(/(\d+)\s*分钟/);
  if(m) return parseInt(m[1]);
  m = s.match(/(\d+)/);
  return m ? parseInt(m[1]) : null;
}
function spanMin(t){
  const mt = (t||'').match(/(\d{1,2}):(\d{2})/g) || [];
  if(mt.length>=2){
    const p = mt[0].split(':').map(Number), q = mt[1].split(':').map(Number);
    return (q[0]*60+q[1]) - (p[0]*60+p[1]);
  }
  return 0;
}
function datesInRange(range){
  const dates = DATA.dates.slice();
  if(range==='all') return dates;
  const ids = dates.map(d=>d.id).sort();
  const last = ids[ids.length-1];
  if(range==='week'){
    const end = new Date(last+'T00:00:00');
    const start = new Date(end); start.setDate(end.getDate()-6);
    const s = start.toISOString().slice(0,10);
    return dates.filter(d=> d.id>=s && d.id<=last);
  }
  if(range==='month'){
    const ym = last.slice(0,7);
    return dates.filter(d=> d.id.slice(0,7)===ym);
  }
  return dates;
}
let barChart, catChart;
function render(range){
  const ds = datesInRange(range);
  // 汇总
  let total=0, maxV=0, maxDay='', days=0;
  const labels=[], vals=[];
  ds.forEach(d=>{
    const v = parseReal(d.stats && d.stats.real);
    if(v!=null){ total+=v; days++; labels.push(d.id.slice(5)); vals.push(v); if(v>maxV){maxV=v; maxDay=d.id.slice(5);} }
  });
  document.getElementById('sTotal').textContent = (total/60).toFixed(1)+'h';
  document.getElementById('sAvg').textContent = days? (total/days/60).toFixed(1)+'h' : '—';
  document.getElementById('sDays').textContent = days;
  document.getElementById('sMax').textContent = maxDay? maxDay+' '+(maxV/60).toFixed(1)+'h' : '—';
  // 柱状图
  if(barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'真实时长(分钟)', data:vals, backgroundColor:'rgba(124,177,210,0.65)', borderRadius:8, maxBarThickness:46 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, grid:{color:'rgba(124,177,210,0.15)'} }, x:{ grid:{display:false} } } }
  });
  // 类别聚合
  const agg = {design:0,study:0,test:0,meet:0,misc:0};
  ds.forEach(d=>{
    (d.segments||[]).forEach(s=>{
      if(s.lunch) return;
      agg[icoToCat(s.ico)] += spanMin(s.time);
    });
  });
  const cats = Object.keys(agg).filter(k=>agg[k]>0);
  const cdata = cats.map(k=>agg[k]);
  const ccolor = cats.map(k=>CAT_COLOR[k]);
  if(catChart) catChart.destroy();
  catChart = new Chart(document.getElementById('catChart'), {
    type:'doughnut',
    data:{ labels:cats.map(k=>CAT[k]), datasets:[{ data:cdata, backgroundColor:ccolor, borderColor:'#fff', borderWidth:2 }]},
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{display:false}} }
  });
  const lg = document.getElementById('legend');
  const tot = cdata.reduce((a,b)=>a+b,0)||1;
  lg.innerHTML = cats.map((k,i)=>`<div class="row"><span class="dot" style="background:${ccolor[i]}"></span>${CAT[k]}<b>${Math.round(cdata[i]/tot*100)}%</b></div>`).join('');
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.range);
  });
});
