<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日工作总结报告 · 汇总</title>
<meta name="theme-color" content="#7CB1D2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #EAF1F8;
    --bg-top: #DCE8F2;
    --card-bg: #ffffff;
    --border: #e6eaee;
    --border-strong: #dbe2e8;
    --text: #3a444d;
    --text-secondary: #8b97a3;
    --title: #2b343b;
    --accent: #7CB1D2;
    --accent-soft: #B8D0E5;
    --accent-tint: #B8D0E526;
    --green: #7fae93;
    --orange: #E0A85A;
    --red: #c98f8f;
    --purple: #a89ec6;
    --teal: #C98AAA;
    --pink: #c79aae;
    --shadow: 0 1px 3px rgba(43,60,80,0.05);
    --radius: 26px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    background:
      radial-gradient(820px 560px at 6% 4%, rgba(124,177,210,0.30), transparent 60%),
      radial-gradient(760px 560px at 96% 14%, rgba(255,230,190,0.32), transparent 60%),
      radial-gradient(900px 680px at 52% 108%, rgba(235,188,194,0.26), transparent 62%),
      radial-gradient(680px 480px at 82% 96%, rgba(184,208,229,0.30), transparent 60%),
      linear-gradient(180deg, #EAF1F8 0%, #EEF4F9 100%);
    min-height: 100vh;
  }

  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: transparent;
    color: var(--text);
    line-height: 1.65;
    padding: 34px 28px 56px;
    max-width: 920px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: 4px;
    background: linear-gradient(90deg, #7CB1D2, #B8D0E5, #D6E8F2, #B8D0E5, #7CB1D2);
    border-radius: 0 0 6px 6px;
  }

  /* 头部 */
  .header-card {
    background: rgba(255,255,255,0.5); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.6); border-radius: 32px;
    position: relative; z-index: 80;
    padding: 34px 28px 28px; text-align: center; margin-bottom: 40px;
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 8px 24px rgba(60,80,100,0.10), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .header-card h1 {
    font-size: 30px; font-weight: 700; color: var(--title);
    letter-spacing: -0.03em; line-height: 1.2;
    display: inline-flex; align-items: center; gap: 12px; justify-content: center;
  }
  .header-card h1 .ico {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--accent-tint);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .header-card .subtitle { color: var(--text-secondary); font-size: 13.5px; margin-top: 10px; letter-spacing: .02em; font-weight: 400; }

  /* 下滑收起的小顶部栏 */
  .sticky-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 90;
    background: linear-gradient(180deg, rgba(247,250,252,0.80), rgba(242,246,249,0.60));
    -webkit-backdrop-filter: saturate(195%) blur(18px); backdrop-filter: saturate(195%) blur(18px);
    border-bottom: 1px solid rgba(214,224,231,0.75);
    box-shadow: 0 6px 24px rgba(40,60,80,0.09);
    transform: translateY(-100%); transition: transform .28s ease, background .2s;
    display: flex; justify-content: center;
  }
  .sticky-bar::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    pointer-events: none;
  }
  .sticky-bar.show { transform: translateY(0); }
  .sb-inner { width: 100%; max-width: 920px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px 28px; }
  .sb-label {
    font-size: 14px; font-weight: 600; color: var(--title); cursor: pointer;
    padding: 5px 12px; border-radius: 9px; display: inline-flex; align-items: center; gap: 8px;
    transition: background .15s;
  }
  .sb-label:hover { background: var(--bg); }
  .sb-label .cal { color: var(--accent); }
  .sb-label .cal svg { width: 17px; height: 17px; }

  .date-row {
    display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 22px;
    position: relative;
  }
  .date-nav {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--accent); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; transition: all .18s;
  }
  .date-nav:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .date-nav:disabled { opacity: .3; cursor: not-allowed; }

  .date-picker { position: relative; }
  .date-btn {
    background: var(--accent-tint); color: var(--accent); border: 1px solid #7CB1D233;
    padding: 9px 20px 9px 16px; border-radius: 24px; font-size: 14px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 9px; transition: all .18s;
  }
  .date-btn:hover { background: #7CB1D226; }
  .date-btn .cal { color: var(--accent); }
  .date-btn .arrow { transition: transform .2s; }
  .date-picker.open .date-btn .arrow { transform: rotate(180deg); }

  .date-dropdown {
    position: fixed; left: 0; top: 0; transform: translateX(-50%) scale(0.96) translateY(-8px);
    background: rgba(255,255,255,0.62); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.7); border-radius: 22px;
    box-shadow: 0 12px 40px rgba(40,60,80,0.14); padding: 8px; min-width: 230px; z-index: 100;
    display: block; visibility: hidden; opacity: 0; pointer-events: none;
    max-height: 320px; overflow-y: auto;
    transition: opacity .26s cubic-bezier(.4,0,.2,1), transform .26s cubic-bezier(.4,0,.2,1), visibility .26s;
  }
  .date-dropdown.open { visibility: visible; opacity: 1; transform: translateX(-50%) scale(1) translateY(0); pointer-events: auto; }
  .date-dropdown .opt {
    padding: 10px 14px; border-radius: 9px; cursor: pointer; font-size: 14px; color: var(--text);
    display: flex; align-items: center; justify-content: space-between; transition: background .12s;
  }
  .date-dropdown .opt:hover { background: rgba(124,177,210,0.14); }
  .date-dropdown .opt.active { background: var(--accent-tint); color: var(--accent); font-weight: 600; }
  .date-dropdown .opt .tag { font-size: 11px; color: var(--text-secondary); }
  .date-dropdown .opt.active .tag { color: var(--accent); }
  .date-dropdown .hint { padding: 8px 14px; font-size: 11px; color: var(--text-secondary); border-top: 1px dashed rgba(124,177,210,0.28); margin-top: 6px; }

  /* 统计卡片 */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; margin-bottom: 44px; }
  .stat-card {
    background: rgba(255,255,255,0.5); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.6); border-radius: var(--radius);
    padding: 22px 18px; text-align: center; position: relative;
    box-shadow: 0 8px 24px rgba(60,80,100,0.10), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .stat-card .label { font-size: 12.5px; color: #5c6875; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; font-weight: 600; }
  .stat-card .value { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: var(--title); }
  .stat-card.c-blue { background: rgba(124,177,210,0.20); border-color: rgba(124,177,210,0.45); }
  .stat-card.c-blue .value { color: #6A9FC0; }
  .stat-card.c-sky { background: rgba(184,208,229,0.24); border-color: rgba(184,208,229,0.55); }
  .stat-card.c-sky .value { color: #6A9FC0; }
  .stat-card.c-pink { background: rgba(235,188,194,0.22); border-color: rgba(235,188,194,0.55); }
  .stat-card.c-pink .value { color: #C98AAA; }
  .stat-card.c-peach { background: rgba(255,230,190,0.28); border-color: rgba(240,210,158,0.6); }
  .stat-card.c-peach .value { color: #E0A85A; }

  /* 区块标题 */
  .section { margin-bottom: 44px; }
  .section-head {
    display: flex; align-items: center; gap: 11px;
    background: rgba(124,177,210,0.18); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(124,177,210,0.40); border-radius: 22px;
    padding: 13px 18px; margin-bottom: 22px;
    box-shadow: 0 8px 24px rgba(60,80,100,0.10), inset 0 1px 0 rgba(255,255,255,0.55);
  }
  .section-head .si { color: var(--accent); display: inline-flex; }
  .section-head .si svg { width: 19px; height: 19px; }
  .section-head .st { font-size: 16.5px; font-weight: 700; color: var(--title); letter-spacing: .01em; }
  .section-head .sm { margin-left: auto; font-size: 12.5px; color: var(--text-secondary); font-weight: 500; }
  .section-head.pink {
    background: rgba(235,188,194,0.18);
    border-color: rgba(235,188,194,0.40);
  }
  .section-head.pink .si { color: var(--teal); }

  /* 时间线 - 项目段 */
  .seg { position: relative; background: rgba(255,255,255,0.5); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.6); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; box-shadow: 0 8px 24px rgba(60,80,100,0.10), inset 0 1px 0 rgba(255,255,255,0.6); transition: transform .32s cubic-bezier(.4,0,.2,1), box-shadow .3s; }
  .seg::before { content: ""; position: absolute; inset: 0; background: rgba(124,177,210,0.16); border-radius: inherit; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
  .seg:hover::before { opacity: 0.08; }
  .seg:active::before, .seg.tapping::before { opacity: 0.18; }
  .seg.fill::before { background: rgba(255,230,190,0.40); }
  .seg.fill:hover::before { opacity: 0.18; }
  .seg.fill:active::before, .seg.fill.tapping::before { opacity: 0.38; }
  .seg-head {
    position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 16px 20px; cursor: pointer; user-select: none; transition: transform .14s cubic-bezier(.4,0,.2,1);
  }
  .seg-head .seg-ico { color: var(--accent); }
  .seg.fill .seg-head .seg-ico { color: var(--orange); }
  .seg-head .seg-name { font-size: 14.5px; font-weight: 600; color: var(--title); flex: 1; letter-spacing: .01em; }
  .seg.fill .seg-head .seg-name { color: #B8832F; }
  .seg-head .seg-time { font-size: 12px; color: var(--text-secondary); }
  .seg-head .arrow { color: var(--text-secondary); transition: transform .2s; }
  .seg.collapsed .arrow { transform: rotate(-90deg); }
  .seg-body { padding: 4px 20px 18px; overflow: hidden; max-height: 2600px; opacity: 1; transform: translateY(0); transition: max-height .42s cubic-bezier(.4,0,.2,1), opacity .3s ease, transform .3s ease, padding .3s ease; will-change: max-height, opacity; }
  .seg.collapsed .seg-body { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; transform: translateY(-10px); }
  @keyframes segPop { 0% { transform: scale(1); } 45% { transform: scale(1.012); } 100% { transform: scale(1); } }
  .seg.tapping { animation: segPop .34s cubic-bezier(.33,1,.68,1); }

  .tl-item { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid #eef1f4; }
  .tl-item:last-child { border-bottom: none; }
  .tl-dot { flex: 0 0 8px; height: 8px; width: 8px; border-radius: 50%; background: var(--accent); margin-top: 8px; }
  .tl-item.fill .tl-dot { background: var(--orange); }
  .tl-time { flex: 0 0 110px; font-size: 12px; font-weight: 700; color: var(--accent); padding-top: 1px; }
  .tl-item.fill .tl-time { color: var(--orange); }
  .tl-item.fill .tl-body .t { background: #FFE6BE1f; border-color: #E0A85A40; border-left-color: var(--orange); color: #B8832F; }
  .tl-body .t {
  font-size: 13.5px; font-weight: 600; color: #3c5b73;
  display: inline-block;
  background: var(--accent-tint);
  border: 1px solid #7CB1D233;
  border-left: 3px solid var(--accent-soft);
  border-radius: 8px;
  padding: 4px 11px;
  margin-bottom: 5px;
}
  .tl-body .d { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }

  .gap-card {
    background: rgba(255,230,190,0.30); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(240,210,158,0.6); border-radius: 16px;
    padding: 14px 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 8px 24px rgba(60,80,100,0.10), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .gap-card .gi { color: var(--orange); }
  .gap-card .gt { font-size: 14px; font-weight: 600; color: #c78d35; }
  .gap-card .gd { font-size: 13px; color: #5c6875; margin-top: 2px; font-weight: 500; }

  /* 工作清单 */
  .checklist-wrap { background: rgba(255,255,255,0.5); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.6); border-radius: var(--radius); padding: 20px 22px; box-shadow: 0 8px 24px rgba(60,80,100,0.10), inset 0 1px 0 rgba(255,255,255,0.6); }
  .checklist-wrap.pink .checklist-head .ct svg { color: var(--teal); }
  .checklist-wrap.pink .copy-btn { background: var(--teal); }
  .checklist-wrap.pink pre#checklistPre { background: #F9ECF1; border-color: #EBBCC2; }
  .checklist-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .checklist-head .ct { font-size: 14.5px; font-weight: 600; color: var(--title); display: flex; align-items: center; gap: 8px; letter-spacing: .01em; }
  .copy-btn {
    background: var(--accent); color: #fff; border: none;
    width: 38px; height: 38px; border-radius: 50%; font-size: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .copy-btn:hover { filter: brightness(1.06); }
  .copy-btn.done { background: var(--green); }
  .to-top {
    position: fixed; right: 22px; bottom: 22px; z-index: 150;
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px rgba(94,147,184,0.40), inset 0 1px 0 rgba(255,255,255,0.35);
    opacity: 0; transform: scale(.4) translateY(16px); pointer-events: none;
    transition: opacity .28s cubic-bezier(.4,0,.2,1), transform .34s cubic-bezier(.4,0,.2,1), filter .15s;
  }
  .to-top.show { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
  .to-top:hover { filter: brightness(1.07); }
  .to-top:active { transform: scale(.92); }
  .to-top svg { width: 19px; height: 19px; stroke-width: 2; }
  pre#checklistPre {
    background: #f6f8fa; border: 1px solid var(--border); border-radius: 20px; padding: 16px 18px;
    font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 13.5px; line-height: 1.9;
    color: var(--title); white-space: pre-wrap; word-break: break-all;
  }

  .scan-info { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 34px; }
  .scan-info h3 { font-size: 13.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; letter-spacing: .03em; text-transform: uppercase; }
  .scan-info ul { list-style: none; padding: 0; }
  .scan-info li { font-size: 13px; color: var(--text-secondary); padding: 4px 0; }

  .footer { text-align: center; padding: 24px; color: var(--text-secondary); font-size: 12px; border-top: 1px solid var(--border); margin-top: 24px; }

  .note-banner { background: #FFE6BE1a; border: 1px solid #E0A85A40; border-radius: 20px; padding: 13px 18px; margin-bottom: 26px; font-size: 13px; color: #B8832F; display: flex; align-items: flex-start; }

  /* 线性 SVG 图标系统 */
  .ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: -0.14em; }
  .header-card .ico { color: var(--accent); }
  .header-card .ico svg { width: 21px; height: 21px; }
  .date-btn .cal svg { width: 17px; height: 17px; }
  .date-btn .arrow svg { width: 12px; height: 12px; transition: transform .2s; }
  .date-nav svg, .cal-nav svg { width: 16px; height: 16px; stroke-width: 2; }
  .seg-head .arrow svg { width: 14px; height: 14px; stroke-width: 2; transition: transform .2s; }
  .seg-head .seg-ico svg { width: 19px; height: 19px; }
  .seg.fill .seg-head .seg-ico svg { color: var(--orange); }
  .copy-btn svg { width: 14px; height: 14px; stroke-width: 2; }
  .checklist-head .ct svg { width: 17px; height: 17px; color: var(--accent); }
  .scan-info li { display: flex; align-items: center; }
  .scan-info li svg { width: 14px; height: 14px; stroke: var(--teal); stroke-width: 2.2; margin-right: 6px; flex: 0 0 14px; }
  .note-banner svg { width: 15px; height: 15px; stroke: #E0A85A; stroke-width: 1.9; margin-right: 6px; flex: 0 0 15px; margin-top: 1px; }
  .gap-card .gi svg { width: 18px; height: 18px; stroke: var(--orange); }
  .seg-emoji { font-size: 17px; }

  /* 日期日历弹窗 */
  .date-dropdown.calendar { width: 288px; padding: 14px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--card-bg); color: var(--accent); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all .15s; }
  .cal-nav:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cal-title { font-size: 14px; font-weight: 700; color: var(--title); }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .cal-week span { text-align: center; font-size: 11px; color: var(--text-secondary); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-cell { min-height: 34px; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; font-size: 12.5px; border-radius: 8px; color: #c2ccd4; cursor: default; position: relative; }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.has { color: var(--title); cursor: pointer; font-weight: 600; }
  .cal-cell.has:hover { background: var(--accent-tint); }
  .cal-cell.has::after { content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .cal-cell.sel { background: var(--accent); color: #fff; }
  .cal-cell.sel::after { background: #fff; }
  .cal-cell.sel:hover { background: var(--accent); }
  .cal-foot { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--text-secondary); text-align: center; }

  .range-tabs { display: flex; gap: 10px; margin: 22px 0; }
  .range-btn { background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.6); border-radius: 20px; padding: 9px 20px; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); transition: all .18s; }
  .range-btn.active { background: var(--accent-tint); color: var(--accent); border-color: rgba(124,177,210,0.5); }
  .view-tabs { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .view-tab { background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.6); border-radius: 20px; padding: 9px 22px; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); transition: all .2s cubic-bezier(.4,0,.2,1); }
  .view-tab.active { background: var(--accent-tint); color: var(--accent); border-color: rgba(124,177,210,0.5); }
  .view-tab:active { transform: scale(.97); }
  .card { background: rgba(255,255,255,0.5); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.6); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(60,80,100,0.10); }
  .chart-box { position: relative; height: 300px; }
  .doughnut-wrap { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .doughnut-box { position: relative; width: 240px; height: 240px; flex: 0 0 240px; }
  .legend { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 180px; }

    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    doc: '<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/><path d="M9.5 12h5M9.5 15.5h5M9.5 8.5h1.5"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3v3.5M16 3v3.5"/><path d="M8 13h.5M11.5 13h.5M15 13h.5M8 16.3h.5M11.5 16.3h.5M15 16.3h.5"/>',
    down: '<path d="M6 9l6 6 6-6"/>',
    left: '<path d="M15 6l-6 6 6 6"/>',
    right: '<path d="M9 6l6 6-6 6"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    list: '<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8l1.5 1.5L12 7M8 14l1.5 1.5L12 13"/><path d="M14.5 8.5h3M14.5 14.5h3"/>',
    warn: '<path d="M12 3l9.5 16.5H2.5z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.4" r="0.9"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
    palette: '<path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.5 0-1.5 1-2.5 2.5-2.5H18a3 3 0 0 0 3-3c0-5-4-9-9-9z"/><circle cx="8" cy="11" r="1.1"/><circle cx="12" cy="8" r="1.1"/><circle cx="16" cy="11" r="1.1"/>',
    food: '<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-1.6 0-2.2 2-2.2 4s.5 4 2.2 4v10"/>',
    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    lab: '<path d="M9 3v6l-4 8a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 17l-4-8V3"/><path d="M8 3h8M7.5 14h9"/>',
    book: '<path d="M4 5a2 2 0 0 1 2-2h5v16H6a2 2 0 0 0-2 2z"/><path d="M20 5a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2z"/>',
    chart: '<path d="M4 20V4M4 20h16"/><rect x="7" y="12" width="3" height="5"/><rect x="12" y="8" width="3" height="9"/><rect x="17" y="5" width="3" height="12"/>'
  };
  function ic(name) { return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>'; }
  function fmtRoutine(ts) {
    if (!ts) return '—';
    return ts.slice(11, 16);
  }
  const SEG_ICON = { '\u{1F4AC}':'chat', '\u{1F3A8}':'palette', '\u{1F37D}\u{FE0F}':'food', '\u{1F512}':'lock', '\u{1F9EA}':'lab', '\u{1F4DA}':'book', '\u{1F4CA}':'chart', '\u{1F4CB}':'copy', '\u{1F4DD}':'list', '\u{26A0}\u{FE0F}':'warn' };
  function segIco(emoji) { const k = SEG_ICON[emoji]; return k ? ic(k) : '<span class="seg-emoji">'+emoji+'</span>'; }


  function renderDate(idx) {
    const d = DATA.dates[idx];
    current = idx;
    const r = d.routine || {};

    // 日期选择器
    const rel = relLabel(d.id);
    $('#dateLabel').textContent = d.label + (rel ? ' · ' + rel : '');
    const sbL = document.getElementById('sbDateLabel'); if (sbL) sbL.textContent = d.label + (rel ? ' · ' + rel : '');
    if (picker.classList.contains('open')) renderCalendar();
    $('#prevBtn').disabled = idx === 0;
    $('#nextBtn').disabled = idx === DATA.dates.length - 1;
    document.querySelectorAll('#dateDropdown .opt').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });

    // 统计卡片
    const s = d.stats;
    let segsHtml = '';
    d.segments.forEach((seg) => {
      const fillCls = seg.fill ? ' fill' : '';
      const lunchCls = seg.lunch ? ' lunch' : '';
      let body = '';
      seg.events.forEach((ev) => {
        const evFill = (seg.fill && !seg.lunch) ? ' fill' : '';
        body += `<div class="tl-item${evFill}">
          <div class="tl-dot"></div>
          <div class="tl-time">${ev.time}</div>
          <div class="tl-body"><div class="t">${ev.t}</div><div class="d">${ev.d || ''}</div></div>
        </div>`;
      });
      const segHtml = seg.lunch
        ? `<div class="gap-card${lunchCls}"><div class="gi">${segIco(seg.ico)}</div><div><div class="gt">${seg.events[0].time}</div><div class="gd">${seg.events[0].d}</div></div></div>`
        : `<div class="seg${fillCls} collapsed">
            <div class="seg-head" onclick="toggleSeg(this)">
              <span class="seg-ico">${segIco(seg.ico)}</span>
              <span class="seg-name">${seg.title}</span>
              <span class="seg-time">${seg.time}</span>
              <span class="arrow">${ic('down')}</span>
            </div>
            <div class="seg-body">${body}</div>
          </div>`;
      segsHtml += segHtml;
    });

    const checklist = d.checklist.join('\n');

    const scanHtml = d.scanInfo.map((x) => `<li>${ic('check')}${x}</li>`).join('');
    const noteHtml = d.note ? `<div class="note-banner">${ic('warn')} <span>${d.note}</span></div>` : '';

    $('#reportView').innerHTML = `
      ${noteHtml}
      <div class="stats-row">
        <div class="stat-card c-blue"><div class="label">到岗 · 企业微信</div><div class="value">${fmtRoutine(r.wecomOpen)}</div></div>
        <div class="stat-card c-sky"><div class="label">收工 · 当日关机</div><div class="value">${fmtRoutine(r.lastShutdown)}</div></div>
        <div class="stat-card c-pink"><div class="label">真实时长</div><div class="value">${s.real}</div></div>
        <div class="stat-card c-peach"><div class="label">空白/补齐</div><div class="value">${s.gaps}</div></div>
      </div>

      <div class="section">
        <div class="section-head"><span class="si">${ic('clock')}</span><span class="st">工作时间线</span><span class="sm">${d.segments.length} 个时段</span></div>
        ${segsHtml}
      </div>

      <div class="section">
        <div class="section-head pink"><span class="si">${ic('list')}</span><span class="st">工作项清单</span></div>
        <div class="checklist-wrap pink">
          <div class="checklist-head">
            <div class="ct">${ic('list')} 当日工作项</div>
            <button class="copy-btn" id="copyBtn" onclick="copyChecklist()" title="复制清单">${ic('copy')}</button>
          </div>
          <pre id="checklistPre">${checklist}</pre>
        </div>
      </div>

      <div class="scan-info">
        <h3>扫描了哪些数据源</h3>
        <ul>${scanHtml}</ul>
      </div>
    `;

    $('#footerView').textContent = d.footer || '';
  }

  function toggleSeg(head) {
    const seg = head.closest('.seg');
    seg.classList.toggle('collapsed');
    seg.classList.remove('tapping');
    void seg.offsetWidth;
    seg.classList.add('tapping');
  }

  function copyChecklist() {
    const text = document.getElementById('checklistPre').textContent;
    const btn = document.getElementById('copyBtn');
    const done = () => {
      btn.innerHTML = ic('check');
      btn.classList.add('done');
      setTimeout(() => { btn.innerHTML = ic('copy'); btn.classList.remove('done'); }, 1500);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ===== 日期日历弹窗 =====
  const picker = $('#datePicker');
  const dd = $('#dateDropdown');

  function relLabel(id) {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const d = new Date(id + 'T00:00:00');
    const diff = Math.round((t - d) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff === -1) return '明天';
    return '';
  }

  const reportMap = {};
  DATA.dates.forEach((d, i) => { reportMap[d.id] = i; });
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  let calDate = new Date(DATA.dates[current].id + 'T00:00:00');

  function renderCalendar() {
    const y = calDate.getFullYear();
    const m = calDate.getMonth();
    let html = '<div class="cal-head">'
      + '<button class="cal-nav" id="calPrev">' + ic('left') + '</button>'
      + '<div class="cal-title">' + y + '年' + (m + 1) + '月</div>'
      + '<button class="cal-nav" id="calNext">' + ic('right') + '</button></div>';
    html += '<div class="cal-week">' + WEEK.map(w => '<span>' + w + '</span>').join('') + '</div>';
    html += '<div class="cal-grid">';
    const startPad = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < startPad; i++) html += '<div class="cal-cell empty"></div>';
    for (let day = 1; day <= daysInMonth; day++) {
      const id = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      const has = (id in reportMap);
      const sel = (id === DATA.dates[current].id);
      const cls = 'cal-cell' + (has ? ' has' : '') + (sel ? ' sel' : '');
      html += '<div class="' + cls + '"' + (has ? ' data-id="' + id + '"' : '') + '>' + day + '</div>';
    }
    html += '</div>';
    const total = Object.keys(reportMap).length;
    html += '<div class="cal-foot">蓝点 = 有日报 · 共 ' + total + ' 天可查 · ‹ › 切换相邻日</div>';
    dd.innerHTML = html;
    document.getElementById('calPrev').addEventListener('click', (e) => { e.stopPropagation(); calDate.setMonth(calDate.getMonth() - 1); renderCalendar(); });
    document.getElementById('calNext').addEventListener('click', (e) => { e.stopPropagation(); calDate.setMonth(calDate.getMonth() + 1); renderCalendar(); });
    dd.querySelectorAll('.cal-cell.has').forEach(cell => {
      cell.addEventListener('click', (e) => {
        e.stopPropagation();
        renderDate(reportMap[cell.getAttribute('data-id')]);
        picker.classList.remove('open');
        dd.classList.remove('open');
      });
    });
  }

  function positionDropdown() {
    const r = $('#dateBtn').getBoundingClientRect();
    dd.style.left = (r.left + r.width / 2) + 'px';
    dd.style.top = (r.bottom + 10) + 'px';
  }
  $('#dateBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const willOpen = !picker.classList.contains('open');
    picker.classList.toggle('open');
    dd.classList.toggle('open');
    if (willOpen) {
      calDate = new Date(DATA.dates[current].id + 'T00:00:00');
      positionDropdown();
      renderCalendar();
    }
  });
  document.addEventListener('click', (e) => {
    if (!picker.contains(e.target) && !dd.contains(e.target)) {
      picker.classList.remove('open');
      dd.classList.remove('open');
    }
  });
  function closeDateDropdown() { picker.classList.remove('open'); dd.classList.remove('open'); }
  window.addEventListener('scroll', () => { if (dd.classList.contains('open')) closeDateDropdown(); }, { passive: true });
  window.addEventListener('resize', () => { if (dd.classList.contains('open')) closeDateDropdown(); });
  $('#prevBtn').addEventListener('click', () => { if (current > 0) renderDate(current - 1); });
  $('#nextBtn').addEventListener('click', () => { if (current < DATA.dates.length - 1) renderDate(current + 1); });

  // 下滑收起的小顶部栏
  const stickyBar = document.getElementById('stickyBar');
  const toTop = document.getElementById('toTop');
  function onScroll() {
    if (stickyBar) stickyBar.classList.toggle('show', window.scrollY > 200);
    if (toTop) toTop.classList.toggle('show', window.scrollY > 300);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  document.getElementById('sbPrev').addEventListener('click', () => { if (current > 0) renderDate(current - 1); });
  document.getElementById('sbNext').addEventListener('click', () => { if (current < DATA.dates.length - 1) renderDate(current + 1); });
  document.getElementById('sbLabel').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  if (toTop) toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));


  // ===== 趋势视图 =====
  const trendView = document.getElementById('trendView');
  let trendBuilt = false, currentRange = 'all', barChart = null, catChart = null;
  const TREND_CAT = { design:'设计产出', study:'学习', test:'测试探索', meet:'沟通会议', misc:'其他' };
  const TREND_COLOR = { design:'#7CB1D2', study:'#B8D0E5', test:'#C98AAA', meet:'#E0A85A', misc:'#9DB0BF' };
  function icoToCat(ico) {
    if (['🎨','🖼️','🌅'].includes(ico)) return 'design';
    if (ico === '📚') return 'study';
    if (ico === '🧪') return 'test';
    if (['💬','📊'].includes(ico)) return 'meet';
    return 'misc';
  }
  function parseRealTrend(s) {
    if (!s) return null;
    let m = s.match(/([\d.]+)\s*小时/);
    if (m) return Math.round(parseFloat(m[1]) * 60);
    m = s.match(/(\d+)\s*分钟/);
    if (m) return parseInt(m[1]);
    m = s.match(/(\d+)/);
    return m ? parseInt(m[1]) : null;
  }
  function spanMinTrend(t) {
    const mt = (t || '').match(/(\d{1,2}):(\d{2})/g) || [];
    if (mt.length >= 2) {
      const p = mt[0].split(':').map(Number), q = mt[1].split(':').map(Number);
      return (q[0] * 60 + q[1]) - (p[0] * 60 + p[1]);
    }
    return 0;
  }
  function datesInRange(range) {
    const dates = DATA.dates.slice();
    if (range === 'all') return dates;
    const ids = dates.map(d => d.id).sort();
    const last = ids[ids.length - 1];
    if (range === 'week') {
      const end = new Date(last + 'T00:00:00');
      const start = new Date(end); start.setDate(end.getDate() - 6);
      const s = start.toISOString().slice(0, 10);
      return dates.filter(d => d.id >= s && d.id <= last);
    }
    if (range === 'month') {
      const ym = last.slice(0, 7);
      return dates.filter(d => d.id.slice(0, 7) === ym);
    }
    return dates;
  }
  function buildTrend() {
    trendView.innerHTML = `
      <div class="range-tabs">
        <div class="range-btn active" data-range="all">全部</div>
        <div class="range-btn" data-range="week">本周</div>
        <div class="range-btn" data-range="month">本月</div>
      </div>
      <div class="stats-row trend-stats">
        <div class="stat-card c-blue"><div class="label">总真实时长</div><div class="value" id="sTotal">—</div></div>
        <div class="stat-card c-sky"><div class="label">日均时长</div><div class="value" id="sAvg">—</div></div>
        <div class="stat-card c-pink"><div class="label">活跃天数</div><div class="value" id="sDays">—</div></div>
        <div class="stat-card c-peach"><div class="label">最长一天</div><div class="value" id="sMax">—</div></div>
      </div>
      <div class="section">
        <div class="section-head"><span class="si">${ic('chart')}</span><span class="st">每日真实时长</span></div>
        <div class="card"><div class="chart-box"><canvas id="barChart"></canvas></div></div>
      </div>
      <div class="section">
        <div class="section-head"><span class="si">${ic('palette')}</span><span class="st">工作类别占比</span></div>
        <div class="card">
          <div class="doughnut-wrap">
            <div class="doughnut-box"><canvas id="catChart"></canvas></div>
            <div class="legend" id="legend"></div>
          </div>
          <div class="trend-note">类别按 emoji 归并：🎨🖼️🌅 设计产出 · 📚 学习 · 🧪 测试探索 · 💬📊 沟通会议 · 其余归其他</div>
        </div>
      </div>`;
    trendView.querySelectorAll('.range-btn').forEach(t => {
      t.addEventListener('click', () => {
        trendView.querySelectorAll('.range-btn').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        currentRange = t.dataset.range;
        renderTrend(currentRange);
      });
    });
  }
  function renderTrend(range) {
    const ds = datesInRange(range);
    let total = 0, maxV = 0, maxDay = '', days = 0;
    const labels = [], vals = [];
    ds.forEach(d => {
      const v = parseRealTrend(d.stats && d.stats.real);
      if (v != null) { total += v; days++; labels.push(d.id.slice(5)); vals.push(v); if (v > maxV) { maxV = v; maxDay = d.id.slice(5); } }
    });
    const sTotal = document.getElementById('sTotal'), sAvg = document.getElementById('sAvg'),
          sDays = document.getElementById('sDays'), sMax = document.getElementById('sMax');
    if (sTotal) sTotal.textContent = (total / 60).toFixed(1) + 'h';
    if (sAvg) sAvg.textContent = days ? (total / days / 60).toFixed(1) + 'h' : '—';
    if (sDays) sDays.textContent = days;
    if (sMax) sMax.textContent = maxDay ? maxDay + ' ' + (maxV / 60).toFixed(1) + 'h' : '—';
    if (typeof Chart === 'undefined') { console.warn('Chart.js 未加载'); return; }
    if (barChart) barChart.destroy();
    barChart = new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: { labels, datasets: [{ label: '真实时长(分钟)', data: vals, backgroundColor: 'rgba(124,177,210,0.65)', borderRadius: 8, maxBarThickness: 46 }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => Math.round(c.parsed.y / 60 * 10) / 10 + ' 小时' } } },
        scales: { y: { beginAtZero: true, grid: { color: 'rgba(124,177,210,0.15)' } }, x: { grid: { display: false } } } }
    });
    const agg = { design: 0, study: 0, test: 0, meet: 0, misc: 0 };
    ds.forEach(d => { (d.segments || []).forEach(s => { if (s.lunch) return; agg[icoToCat(s.ico)] += spanMinTrend(s.time); }); });
    const cats = Object.keys(agg).filter(k => agg[k] > 0);
    const cdata = cats.map(k => agg[k]);
    const ccolor = cats.map(k => TREND_COLOR[k]);
    if (catChart) catChart.destroy();
    catChart = new Chart(document.getElementById('catChart'), {
      type: 'doughnut',
      data: { labels: cats.map(k => TREND_CAT[k]), datasets: [{ data: cdata, backgroundColor: ccolor, borderColor: '#fff', borderWidth: 2 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '62%',
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => { const tot = c.dataset.data.reduce((a, b) => a + b, 0) || 1; return c.label + ' ' + Math.round(c.parsed / tot * 100) + '%'; } } } } }
    });
    const lg = document.getElementById('legend');
    const tot = cdata.reduce((a, b) => a + b, 0) || 1;
    if (lg) lg.innerHTML = cats.map((k, i) => `<div class="row"><span class="dot" style="background:${ccolor[i]}"></span>${TREND_CAT[k]}<b>${Math.round(cdata[i] / tot * 100)}%</b></div>`).join('');
  }
  function setView(v) {
    document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
    const dailyPanel = document.getElementById('dailyPanel');
    const dateRow = document.querySelector('.date-row');
    if (v === 'trend') {
      dailyPanel.style.display = 'none';
      trendView.style.display = 'block';
      if (dateRow) dateRow.style.display = 'none';
      closeDateDropdown();
      if (stickyBar) stickyBar.style.display = 'none';
      if (!trendBuilt) { buildTrend(); trendBuilt = true; }
      renderTrend(currentRange);
    } else {
      dailyPanel.style.display = 'block';
      trendView.style.display = 'none';
      if (dateRow) dateRow.style.display = '';
      if (stickyBar) stickyBar.style.display = '';
      onScroll();
    }
  }
  document.querySelectorAll('.view-tab').forEach(t => {
    t.addEventListener('click', () => setView(t.dataset.view));
  });

  // ===== 入场封面 Splash =====
  const splash = document.getElementById('splash');
  function dismissSplash(v) {
    if (!splash || splash.classList.contains('out')) return;
    setView(v || 'daily');
    splash.classList.add('out');
    setTimeout(() => { splash.style.display = 'none'; }, 520);
  }
  if (splash) {
    splash.querySelectorAll('.splash-btn').forEach(b => {
      b.addEventListener('click', (e) => { e.stopPropagation(); dismissSplash(b.dataset.go); });
    });
    splash.addEventListener('click', () => dismissSplash('daily'));
    requestAnimationFrame(() => splash.classList.add('in'));
  }

  renderDate(current);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
